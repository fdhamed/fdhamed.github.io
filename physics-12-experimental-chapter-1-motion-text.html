<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    background:#07111f;

    color:#eaf7ff;

    line-height:1.9;

    min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{

    position:sticky;

    top:0;

    z-index:1000;

    background:rgba(7,17,31,0.96);

    backdrop-filter:blur(10px);

    border-bottom:
    1px solid
    rgba(99,216,255,0.18);

}

.header-inner{

    max-width:1100px;

    margin:auto;

    padding:
    14px
    20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

}

.logo{

    color:#63d8ff;

    text-decoration:none;

    font-size:1.25rem;

    font-weight:bold;

    letter-spacing:1px;

}

nav{

    display:flex;

    flex-wrap:wrap;

    gap:14px;

}

nav a{

    color:#b9d9e8;

    text-decoration:none;

    font-size:0.9rem;

    transition:0.2s;

}

nav a:hover{

    color:#63d8ff;

}


/* =========================
   MAIN
========================= */

main{

    max-width:1100px;

    margin:auto;

    padding:
    55px
    20px
    70px;

}


/* =========================
   PAGE INTRO
========================= */

.page-header{

    text-align:center;

    margin-bottom:35px;

}

.eyebrow{

    color:#63d8ff;

    font-size:0.95rem;

    margin-bottom:8px;

}

h1{

    font-size:
    clamp(2rem,5vw,3.2rem);

    margin-bottom:10px;

    color:#ffffff;

}

.subtitle{

    color:#a9c4d3;

    font-size:1rem;

}


/* =========================
   PDF SECTION
========================= */

.pdf-section{

    background:
    linear-gradient(
        145deg,
        rgba(99,216,255,0.07),
        rgba(255,255,255,0.025)
    );

    border:
    1px solid
    rgba(99,216,255,0.20);

    border-radius:22px;

    padding:20px;

    box-shadow:
    0 15px 45px
    rgba(0,0,0,0.25);

}


/* =========================
   PDF HEADER
========================= */

.pdf-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;

    flex-wrap:wrap;

}

.pdf-title{

    color:#ffffff;

    font-size:1.2rem;

    font-weight:bold;

}

.pdf-description{

    color:#9eb9c8;

    font-size:0.9rem;

}


/* =========================
   PDF BUTTON
========================= */

.pdf-button{

    display:inline-block;

    background:#63d8ff;

    color:#06111d;

    text-decoration:none;

    font-weight:bold;

    padding:
    9px
    16px;

    border-radius:10px;

    transition:0.2s;

    white-space:nowrap;

}

.pdf-button:hover{

    transform:translateY(-2px);

    box-shadow:
    0 8px 20px
    rgba(99,216,255,0.25);

}


/* =========================
   PDF VIEWER
========================= */

.pdf-viewer{

    width:100%;

    height:75vh;

    min-height:650px;

    border:none;

    border-radius:14px;

    background:#ffffff;

    display:block;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header-inner{

        flex-direction:column;

        align-items:flex-start;

    }

    nav{

        width:100%;

        overflow-x:auto;

        flex-wrap:nowrap;

        padding-bottom:4px;

    }

    nav a{

        white-space:nowrap;

    }

    main{

        padding:
        35px
        12px
        50px;

    }

    .pdf-section{

        padding:10px;

        border-radius:16px;

    }

    .pdf-header{

        align-items:flex-start;

        flex-direction:column;

    }

    .pdf-button{

        width:100%;

        text-align:center;

    }

    .pdf-viewer{

        height:72vh;

        min-height:500px;

        border-radius:10px;

    }

}


/* =========================
   FOOTER
========================= */

footer{

    text-align:center;

    border-top:
    1px solid
    rgba(99,216,255,0.12);

    padding:
    25px
    15px;

    color:#6f8b9a;

    font-size:0.85rem;

}

.footer-line{

    margin-top:5px;

    color:#526b79;

}

</style>

</head>

<!-- =========================

        <p class="subtitle">

    <!-- =========================

    ========================= -->

    <section class="pdf-section">


        <div class="pdf-header">

            <div>

                <div class="pdf-title">

                </div>

                </div>

            <a

        </div>
